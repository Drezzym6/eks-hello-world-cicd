name: Build and Push (GitOps CI)

on:
  push:
    branches:
      - gitops

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 730335365330.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-2-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::730335365330:role/tech-challenge-2-github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:${{ steps.vars.outputs.tag }} ./app

      - name: Push image to ECR
        run: |
          docker push $ECR_REPOSITORY:${{ steps.vars.outputs.tag }}

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag: .*|tag: ${{ steps.vars.outputs.tag }}|" helm/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "Update image tag to ${{ steps.vars.outputs.tag }} [skip ci]"
          git push
