apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::730335365330:role/tech-challenge-2-eks-node-role
      groups:
        - system:bootstrappers
        - system:nodes
      username: system:node:{{EC2PrivateDNSName}}
    - rolearn: arn:aws:iam::730335365330:role/tech-challenge-2-jenkins-role
      groups:
        - jenkins-deployers
      username: jenkins