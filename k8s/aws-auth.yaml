apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/hello-world-eks-node-role
      groups:
        - system:bootstrappers
        - system:nodes
      username: system:node:{{EC2PrivateDNSName}}
    - rolearn: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/hello-world-jenkins-role
      groups:
        - jenkins-deployers
      username: jenkins